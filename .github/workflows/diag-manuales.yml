# TEMPORAL: comprobar sesiones_manuales.py contra TMDb. Se borra antes de fusionar.
name: Diagnóstico sesiones manuales
on:
  push:
    branches: [claude/loving-ritchie-j5ghqi]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Ejecutar sin tocar los datos
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cp peliculas_vose.json /tmp/vose.json
          python sesiones_manuales.py --salida /tmp/vose.json
          python - <<'PY'
          import json, os
          d = json.load(open('/tmp/vose.json'))
          for x in d:
              if x.get('fuente') == 'manual':
                  c = x['cartel']
                  print(f"{x['título']} | tmdb {x['tmdb_id']} | {x['director']} | {x['año']} | {x['duración']} | cartel {c} ({os.path.getsize(c) if c and os.path.exists(c) else 'NO'}) | sinopsis {(x['sinopsis'] or '')[:60]!r}")
          PY
