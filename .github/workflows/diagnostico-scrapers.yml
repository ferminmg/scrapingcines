name: Diagnóstico TMDb (temporal)
on:
  push:
    branches: [claude/diagnostico-scrapers]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests beautifulsoup4 python-dotenv
      - run: python diag/tmdb_diag.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
